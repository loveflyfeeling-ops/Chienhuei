<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="robots" content="noindex">
<title>奇門擇吉｜會員登入</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@700;900&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--paper:#E6ECE8;--sheet:#F7F9F7;--ink:#1F2B3D;--muted:#5D6A78;--line:#C9D3CE;--lacquer:#A3322A;--brass:#B88A1B;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--paper:#141B24;--sheet:#1C2532;--ink:#E4E8EC;--muted:#9AA6B2;--line:#2E3A48;--lacquer:#E06A5E;--brass:#E2B54A;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--paper);color:var(--ink);font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;padding:24px 16px}
.card{width:100%;max-width:380px;background:var(--sheet);border:1px solid var(--line);border-radius:20px;padding:28px 24px;box-shadow:0 8px 30px rgba(0,0,0,.08)}
h1{font-family:"Noto Serif TC",serif;font-size:1.7rem;letter-spacing:.12em;margin:0 0 4px;text-align:center}
.sub{color:var(--muted);text-align:center;margin:0 0 22px;font-size:.92rem}
label{display:block;font-weight:700;font-size:.92rem;margin:14px 0 6px}
input[type=text],input[type=password]{width:100%;font:inherit;font-size:1rem;padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:var(--paper);color:var(--ink)}
input:focus{outline:3px solid var(--brass);outline-offset:1px}
.row{display:flex;align-items:center;gap:8px;margin:14px 0 4px;font-size:.92rem;color:var(--muted)}
button{width:100%;margin-top:18px;font:inherit;font-weight:700;font-size:1.05rem;padding:12px;border:0;border-radius:12px;background:var(--lacquer);color:#fff;cursor:pointer}
button:disabled{opacity:.6;cursor:wait}
.msg{min-height:1.4em;margin:12px 0 0;text-align:center;font-size:.92rem;color:var(--lacquer)}
.msg.ok{color:var(--muted)}
.foot{margin-top:18px;font-size:.8rem;color:var(--muted);text-align:center;line-height:1.6}
</style>
</head>
<body>
<main class="card" id="card">
  <h1>奇門擇吉</h1>
  <p class="sub">會員專區・請登入後使用</p>
  <form id="f" autocomplete="on">
    <label for="u">帳號</label>
    <input type="text" id="u" name="username" autocomplete="username" autocapitalize="none" spellcheck="false" required>
    <label for="p">密碼</label>
    <input type="password" id="p" name="password" autocomplete="current-password" required>
    <div class="row"><input type="checkbox" id="rm" checked><label for="rm" style="margin:0;font-weight:400">在這台裝置記住我</label></div>
    <button id="go" type="submit">登入</button>
    <p class="msg" id="msg" role="status"></p>
  </form>
  <p class="foot">帳號密碼請向管理者索取。<br>公用電腦請勿勾選「記住我」。</p>
</main>
<script>
(()=>{
const E=new TextEncoder(),D=new TextDecoder();
const ub=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
const b64=u=>{u=new Uint8Array(u);let s='';for(let i=0;i<u.length;i+=32768)s+=String.fromCharCode.apply(null,u.subarray(i,i+32768));return btoa(s)};
const C=crypto.subtle,KEY='qmzj_auth';
const $=id=>document.getElementById(id),msg=(t,ok)=>{$('msg').textContent=t;$('msg').className='msg'+(ok?' ok':'')};
const today=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
async function uid(name){return b64(await C.digest('SHA-256',E.encode('qmzj|'+name.trim().toLowerCase())))}
async function pwKey(pw,salt){const k=await C.importKey('raw',E.encode(pw),'PBKDF2',false,['deriveKey']);
  return C.deriveKey({name:'PBKDF2',hash:'SHA-256',salt:ub(salt),iterations:310000},k,{name:'AES-GCM',length:256},false,['decrypt'])}
let M=null,ENC=null;
async function load(){
  if(!M)M=await (await fetch('members.json?t='+Date.now(),{cache:'no-store'})).json();
  if(!ENC)ENC=fetch('app.enc?t='+(M.updated||''),{cache:'no-cache'}).then(r=>{if(!r.ok)throw new Error('enc');return r.json()});
}
function slotOK(s){return s&&(!s.exp||today()<=s.exp)}
async function openApp(pk8,id){
  const priv=await C.importKey('pkcs8',pk8,{name:'ECDH',namedCurve:'P-256'},false,['deriveBits']);
  const e=await ENC;
  const epk=await C.importKey('raw',ub(e.epk),{name:'ECDH',namedCurve:'P-256'},false,[]);
  const bits=await C.deriveBits({name:'ECDH',public:epk},priv,256);
  const hk=await C.importKey('raw',bits,'HKDF',false,['deriveKey']);
  const ak=await C.deriveKey({name:'HKDF',hash:'SHA-256',salt:ub(e.salt),info:E.encode('qmzj-app')},hk,{name:'AES-GCM',length:256},false,['decrypt']);
  let buf=await C.decrypt({name:'AES-GCM',iv:ub(e.iv)},ak,ub(e.ct));
  if(e.z){buf=await new Response(new Blob([buf]).stream().pipeThrough(new DecompressionStream('gzip'))).arrayBuffer()}
  let html=D.decode(buf);
  const s=M.slots.find(x=>x.id===id);
  const tag=`<div id="qmzjOut" style="position:fixed;right:10px;bottom:10px;z-index:9999;display:flex;gap:6px;align-items:center;font:13px/1.2 system-ui,sans-serif"><span style="background:rgba(0,0,0,.55);color:#fff;padding:5px 9px;border-radius:999px">${s&&s.exp?'會員到期 '+s.exp:'會員'}</span><button type="button" onclick="try{localStorage.removeItem('${KEY}')}catch(e){};sessionStorage.removeItem('${KEY}');location.reload()" style="border:0;background:#A3322A;color:#fff;padding:6px 11px;border-radius:999px;cursor:pointer;font:inherit;font-weight:700">登出</button></div>`;
  html=html.includes('</body>')?html.replace(/<\/body>(?![\s\S]*<\/body>)/,tag+'</body>'):html+tag;
  document.open();document.write(html);document.close();
}
function saved(){try{return JSON.parse(localStorage.getItem(KEY)||sessionStorage.getItem(KEY)||'null')}catch(e){try{return JSON.parse(sessionStorage.getItem(KEY)||'null')}catch(x){return null}}}
function clearSaved(){try{localStorage.removeItem(KEY)}catch(e){}try{sessionStorage.removeItem(KEY)}catch(e){}}
async function auto(){
  if(location.protocol==='file:'){msg('請把檔案上傳到網站後再開啟（直接開本機檔案無法登入）。');return}
  const a=saved();if(!a)return;
  try{msg('自動登入中…',1);await load();const s=M.slots.find(x=>x.id===a.id);
    if(!slotOK(s)){clearSaved();msg(s?'會員資格已到期，請聯絡管理者續約。':'此帳號已停用，請重新登入。');return}
    await openApp(ub(a.k),a.id)}catch(e){clearSaved();msg('自動登入失敗，請重新登入。')}
}
$('f').addEventListener('submit',async ev=>{ev.preventDefault();
  const u=$('u').value,p=$('p').value;if(!u.trim()||!p)return;
  $('go').disabled=true;msg('驗證中…',1);
  try{await load();const id=await uid(u);const s=M.slots.find(x=>x.id===id);
    if(!s){msg('帳號或密碼錯誤');return}
    let pk8;try{pk8=await C.decrypt({name:'AES-GCM',iv:ub(s.iv)},await pwKey(p,s.salt),ub(s.wk))}catch(e){msg('帳號或密碼錯誤');return}
    if(!slotOK(s)){msg('會員資格已於 '+s.exp+' 到期，請聯絡管理者續約。');return}
    const rec=JSON.stringify({id,k:b64(pk8)});
    if($('rm').checked){try{localStorage.setItem(KEY,rec)}catch(e){}}else{try{sessionStorage.setItem(KEY,rec)}catch(e){}}
    msg('登入成功，載入中…',1);await openApp(pk8,id);
  }catch(e){console.error(e);msg(String(e).includes('enc')||String(e).includes('JSON')?'找不到網站資料檔（members.json／app.enc），請聯絡管理者。':'登入時發生錯誤，請重新整理後再試。')}
  finally{const g=$('go');if(g)g.disabled=false}
});
auto();
})();
</script>
</body>
</html>
